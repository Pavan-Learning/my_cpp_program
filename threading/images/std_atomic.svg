<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Compare exchange withdrawal</title><desc id="desc">Two workers observe 100. The first changes the balance to 40. The second comparison fails, observes 40, and rejects the withdrawal.</desc>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#18212f">
    <text x="40" y="50" font-size="28" font-weight="bold">Compare the checked value and update in one operation</text>
    <rect x="40" y="110" width="420" height="180" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="65" y="150" font-size="23">Worker 1: succeeds</text><text x="65" y="195" font-size="20">Expected 100, desired 40</text><text x="65" y="240" font-size="20">Balance becomes 40</text>
    <rect x="540" y="110" width="420" height="180" rx="8" fill="#fef3c7" stroke="#a16207"/><text x="565" y="150" font-size="23">Worker 2: retries its decision</text><text x="565" y="195" font-size="20">Expected 100, actual 40</text><text x="565" y="240" font-size="20">observed = 40; reject 60</text>
    <text x="40" y="344" font-size="21">Final: one withdrawal, balance 40. Either worker may win.</text>
    <text x="40" y="387" font-size="18">Atomic load + atomic store is not an atomic read-modify-write.</text>
  </g>
</svg>