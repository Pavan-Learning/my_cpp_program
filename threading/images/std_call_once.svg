<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Call once retries exceptions</title><desc id="desc">The first active initialization throws and leaves the flag incomplete. A second active call succeeds. Other calls return with the published configuration.</desc>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#18212f">
    <text x="40" y="50" font-size="28" font-weight="bold">One successful initialization, not necessarily one attempt</text>
    <rect x="40" y="125" width="280" height="170" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="60" y="165" font-size="22">Attempt 1</text><text x="60" y="211" font-size="20">Throws to its caller</text><text x="60" y="255" font-size="18">Flag still incomplete</text>
    <rect x="360" y="125" width="280" height="170" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="380" y="165" font-size="22">Attempt 2</text><text x="380" y="211" font-size="20">Returns successfully</text><text x="380" y="255" font-size="18">Flag complete</text>
    <rect x="680" y="125" width="280" height="170" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="700" y="165" font-size="22">Passive callers</text><text x="700" y="211" font-size="20">Do not initialize again</text><text x="700" y="255" font-size="18">See published state</text>
    <path d="M320 210 H360 M640 210 H680" stroke="#334155" stroke-width="3"/>
    <text x="40" y="354" font-size="20">All callers share one once_flag. No reset operation is provided.</text>
    <text x="40" y="394" font-size="18">Retry does not roll back side effects from a failed initializer.</text>
  </g>
</svg>