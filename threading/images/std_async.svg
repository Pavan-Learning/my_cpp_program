<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550" role="img" aria-labelledby="title description">
  <title id="title">C++ std::async</title>
  <desc id="description">A visual guide to launching a callable, receiving its value or exception through a future, async versus deferred execution, timed waits, bank transfers, and async future lifetime rules.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e8edf0" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2563a6"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #202e38; letter-spacing: 0; }
      .title { font-size: 43px; font-weight: 700; }
      .subtitle { font-size: 20px; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .code { font-family: 'DejaVu Sans Mono', monospace; font-size: 16px; }
      .bold { font-weight: 700; }
      .blue { fill: #175c9e; }
      .green { fill: #16704b; }
      .red { fill: #af3040; }
      .panel { fill: #fff; stroke: #b9c9d3; stroke-width: 1.5; }
      .flow { fill: none; stroke: #2563a6; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1550" fill="#f7fafb"/>
  <rect width="1200" height="1550" fill="url(#grid)"/>

  <text x="32" y="62" class="title">C++ <tspan class="blue">std::async</tspan></text>
  <text x="34" y="96" class="subtitle">One callable. One execution policy. One future for the outcome.</text>
  <text x="34" y="124" class="small">C++11 and later | Runnable companion: std_async.cpp | Example uses C++17</text>

  <rect x="28" y="148" width="1144" height="194" rx="8" class="panel"/>
  <text x="48" y="180" class="heading">1. The mental model: the library connects execution to a result</text>
  <rect x="56" y="202" width="270" height="82" rx="6" fill="#eaf2fc" stroke="#90b5da"/>
  <text x="76" y="232" class="heading blue">CALLABLE</text>
  <text x="76" y="261" class="code">return value / throw</text>
  <path d="M330 244H446" class="flow"/>
  <text x="340" y="225" class="small">outcome</text>
  <rect x="454" y="202" width="292" height="82" rx="6" fill="#fff7d9" stroke="#d7bc5d"/>
  <text x="474" y="232" class="heading">SHARED STATE</text>
  <text x="474" y="261" class="body">pending / value / exception</text>
  <path d="M750 244H866" class="flow"/>
  <text x="770" y="225" class="small">get()</text>
  <rect x="874" y="202" width="270" height="82" rx="6" fill="#e9f6ed" stroke="#87b69a"/>
  <text x="894" y="232" class="heading green">CONSUMER</text>
  <text x="894" y="261" class="code">std::future&lt;T&gt;</text>
  <text x="56" y="316" class="body bold">No explicit promise, set_value(), set_exception(), or thread.join() in your code.</text>

  <rect x="28" y="358" width="558" height="238" rx="8" class="panel"/>
  <text x="48" y="392" class="heading blue">2. Launch, do other work, receive</text>
  <text x="48" y="431" class="code">auto result = std::async(</text>
  <text x="48" y="459" class="code">    std::launch::async,</text>
  <text x="48" y="487" class="code">    [] { return 42; });</text>
  <text x="48" y="526" class="body">Main can do independent work here.</text>
  <text x="48" y="564" class="code green">int answer = result.get();</text>

  <rect x="602" y="358" width="570" height="238" rx="8" class="panel"/>
  <text x="622" y="392" class="heading green">3. Pick the execution policy</text>
  <text x="622" y="430" class="code blue bold">std::launch::async</text>
  <text x="622" y="458" class="body">Separate thread, if launching succeeds.</text>
  <text x="622" y="496" class="code green bold">std::launch::deferred</text>
  <text x="622" y="524" class="body">First wait() / get() runs it on the waiting thread.</text>
  <text x="622" y="567" class="small bold">Default policy: background execution is not guaranteed.</text>

  <rect x="28" y="612" width="558" height="248" rx="8" class="panel"/>
  <text x="48" y="646" class="heading blue">4. Wait versus get</text>
  <text x="48" y="685" class="code bold">valid()</text>
  <text x="218" y="685" class="body">Has a state, not "is ready".</text>
  <text x="48" y="721" class="code bold">wait()</text>
  <text x="218" y="721" class="body">Wait; keep the result.</text>
  <text x="48" y="757" class="code bold">get()</text>
  <text x="218" y="757" class="body">Value or rethrown exception.</text>
  <text x="48" y="797" class="small green">After ordinary future.get(): valid() == false.</text>
  <text x="48" y="830" class="small">wait() does not rethrow the stored task exception.</text>

  <rect x="602" y="612" width="570" height="248" rx="8" class="panel"/>
  <text x="622" y="646" class="heading">5. Three timed-wait statuses</text>
  <text x="622" y="685" class="code green">ready</text>
  <text x="758" y="685" class="body">Value OR exception available.</text>
  <text x="622" y="721" class="code blue">timeout</text>
  <text x="758" y="721" class="body">Still pending; not canceled.</text>
  <text x="622" y="757" class="code">deferred</text>
  <text x="758" y="757" class="body">Saved call has not started.</text>
  <text x="622" y="797" class="small bold">Timed waits do not start a deferred task.</text>
  <text x="622" y="830" class="small">No non-timed wait? Deferred work never runs.</text>

  <rect x="28" y="876" width="558" height="222" rx="8" class="panel"/>
  <text x="48" y="910" class="heading red">6. Exceptions travel automatically</text>
  <text x="48" y="950" class="body">Task throws instead of returning a value.</text>
  <path d="M65 963V983" class="flow"/>
  <text x="48" y="1010" class="body">Library stores the exception in the shared state.</text>
  <path d="M65 1023V1043" class="flow"/>
  <text x="48" y="1070" class="body bold">Consumer catches it around future.get().</text>

  <rect x="602" y="876" width="570" height="222" rx="8" fill="#fff7d9" stroke="#d7bc5d"/>
  <text x="622" y="910" class="heading red">7. Destruction can wait</text>
  <text x="622" y="948" class="body">Releasing the last async-state reference can</text>
  <text x="622" y="978" class="body">wait for its associated thread to finish.</text>
  <text x="622" y="1015" class="body bold">Discarding the future is not detaching.</text>
  <text x="622" y="1048" class="small">Temporary futures can make two launches sequential.</text>
  <text x="622" y="1078" class="small">Store both futures before waiting to allow overlap.</text>

  <rect x="28" y="1114" width="1144" height="188" rx="8" class="panel"/>
  <text x="48" y="1148" class="heading green">8. Bank transfer: calculate using copies, apply in main</text>
  <text x="48" y="1188" class="body bold">Pavan: 50000 to 49500</text>
  <text x="48" y="1220" class="body">Sagar: 60000 to 60500</text>
  <path d="M340 1200H456" class="flow"/>
  <text x="350" y="1178" class="small">send 500</text>
  <text x="478" y="1188" class="body">Task returns TransferResult; get() receives it.</text>
  <text x="478" y="1220" class="body">Only main updates the original account balances.</text>
  <text x="48" y="1271" class="body red">Requests for 100000 or 0 throw; main catches the error and leaves balances unchanged.</text>

  <rect x="28" y="1318" width="558" height="170" rx="8" class="panel"/>
  <text x="48" y="1352" class="heading">9. Arguments and ownership</text>
  <text x="48" y="1388" class="body">Ordinary arguments are copied or moved.</text>
  <text x="48" y="1421" class="body">std::ref() / reference captures share originals.</text>
  <text x="48" y="1454" class="body bold">Keep references alive; prevent data races.</text>

  <rect x="602" y="1318" width="570" height="170" rx="8" class="panel"/>
  <text x="622" y="1352" class="heading">10. Remember the boundaries</text>
  <text x="622" y="1388" class="body">Not automatic cancellation or a fixed-size pool.</text>
  <text x="622" y="1421" class="body">Not a mutex for other shared data.</text>
  <text x="622" y="1454" class="body">Launch failures are thrown by async() itself.</text>

  <text x="32" y="1525" class="body bold blue">async = execute separately. deferred = execute on wait. future = receive the outcome.</text>
</svg>