<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Packaged task with two result readers</title><desc id="desc">An executor invokes a packaged task. Its result or exception enters one shared state. Separate shared future handles let two readers observe that state.</desc>
  <rect width="1000" height="440" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#18212f">
    <text x="40" y="50" font-size="28" font-weight="bold">One invocation, one result state, multiple readers</text>
    <rect x="40" y="155" width="270" height="130" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="60" y="195" font-size="22">packaged_task</text><text x="60" y="234" font-size="19">Executor calls operator()</text><text x="60" y="264" font-size="17">Scheduling is separate</text>
    <rect x="360" y="155" width="280" height="130" rx="8" fill="#fef3c7" stroke="#a16207"/><text x="380" y="195" font-size="22">Shared state</text><text x="380" y="239" font-size="20">Value 42 or exception</text>
    <rect x="720" y="110" width="240" height="90" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="740" y="147" font-size="21">Reader 1</text><text x="740" y="178" font-size="18">Own handle copy</text>
    <rect x="720" y="240" width="240" height="90" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="740" y="277" font-size="21">Reader 2</text><text x="740" y="308" font-size="18">Own handle copy</text>
    <path d="M310 220 H360 M640 220 H680 V155 H720 M680 220 V285 H720" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="40" y="389" font-size="20">shared_future::get() can be repeated; it does not rerun the computation.</text>
  </g>
</svg>