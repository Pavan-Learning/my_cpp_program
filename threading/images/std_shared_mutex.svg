<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Reader writer ownership</title><desc id="desc">Multiple readers may share ownership to copy a consistent revision and total. A writer obtains exclusive ownership before updating both fields.</desc>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#18212f">
    <text x="40" y="50" font-size="28" font-weight="bold">Shared readers OR one exclusive writer</text>
    <rect x="40" y="115" width="420" height="185" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="65" y="154" font-size="23">Read mode</text><text x="65" y="200" font-size="20">Reader 1 + Reader 2</text><text x="65" y="242" font-size="20">shared_lock; return a copy</text><text x="65" y="277" font-size="18">No protected-state mutations</text>
    <rect x="540" y="115" width="420" height="185" rx="8" fill="#fef3c7" stroke="#a16207"/><text x="565" y="154" font-size="23">Write mode</text><text x="565" y="200" font-size="20">Writer only</text><text x="565" y="242" font-size="20">unique_lock; update both fields</text><text x="565" y="277" font-size="18">All readers and writers excluded</text>
    <text x="40" y="353" font-size="21">Invariant in every snapshot: total = revision * 10</text>
    <text x="40" y="393" font-size="18">No standard atomic upgrade. Unlock, acquire exclusive ownership, then recheck.</text>
  </g>
</svg>